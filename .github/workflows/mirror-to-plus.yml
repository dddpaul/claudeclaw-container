name: Mirror to plus

# Propagates shared container-scaffolding changes (Dockerfile, entrypoint, the
# backup/healthcheck/migrate-* scripts) from this repo to a *review* PR in
# claudeclaw-plus-container, so the two images stay at parity without manual
# copy-paste. Branding and a local build are reviewed on the generated PR — this
# workflow never merges. Engine: scripts/mirror-to-plus.sh.
#
# Auth: a release-bot GitHub App token scoped to the plus repo (the default
# GITHUB_TOKEN cannot write to another repo). Requires that App installed on
# claudeclaw-plus-container plus the RELEASE_BOT_APP_ID / RELEASE_BOT_PRIVATE_KEY
# secrets (the same App the release pipeline uses).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref to diff from (default: previous main tip)"
        required: false
      head_ref:
        description: "Head ref to diff to (default: HEAD)"
        required: false

permissions:
  contents: read

concurrency:
  group: mirror-to-plus
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror shared changes → plus PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mint a token scoped to the plus repo
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: claudeclaw-plus-container

      - name: Mirror
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE_SHA: ${{ github.event.inputs.base_ref || github.event.before }}
          HEAD_SHA: ${{ github.event.inputs.head_ref || github.sha }}
        run: bash scripts/mirror-to-plus.sh
